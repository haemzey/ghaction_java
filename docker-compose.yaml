services:

  db:
    build:
      context: ./db
    image: restaurant-db:v1
    container_name: restaurant-db
    restart: unless-stopped
    networks:
      - restaurant-network
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ./server
    image: restaurant-server:v1
    container_name: restaurant-server
    restart: unless-stopped
    networks:
      - restaurant-network
    environment:
      - MONGODB_URI=mongodb://db:27017/restaurant_management
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongo_data:

networks:
  restaurant-network:
    driver: bridge